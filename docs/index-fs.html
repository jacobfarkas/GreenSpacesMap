<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>GreenSpacesMap - NYC Park Access</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Map styles -->
  <link rel="stylesheet" href="css/map.css"/>
</head>
<body>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Search bar - Google Maps style -->
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      id="search-input"
      placeholder="Search an NYC address..."
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >
    <button class="search-clear" id="search-clear" style="display:none">✕</button>
  </div>

  <!-- Autocomplete dropdown -->
  <div class="search-dropdown" id="search-dropdown"></div>

  <!-- Result card - slides up from bottom -->
  <div class="result-card" id="result-card">
    <div class="result-card-handle"></div>
    <div class="result-card-body">
      <div class="result-address" id="result-address"></div>
      <div class="result-nta" id="result-nta"></div>
      <div class="result-park" id="result-park"></div>
      <div class="result-walk" id="result-walk"></div>
      <div class="result-grade" id="result-grade"></div>
    </div>
  </div>

  <!-- Banner -->
  <div class="map-title">
    <div class="map-title-icon">🌿</div>
    <div class="map-title-text">
      <div class="map-title-heading">
        <span class="title-green">Green</span><br>
        <span class="title-spaces">Spaces</span><br>
        <span class="title-map">MAP</span>
      </div>
      <div class="map-title-sub">Mapping NYC park access</div>
    </div>
  </div>

  <!-- Layer toggle button (mobile only) -->
  <button class="layers-btn" id="layers-btn">
    <span>&#9776;</span> Layers
  </button>

  <!-- Mode switcher -->
<div class="mode-bar">
  <button id="mode-walk" class="mode-btn active">🚶 Walk</button>
  <button id="mode-subway" class="mode-btn">🚇 Subway</button>
</div>

  <!-- Layers panel -->
  <div class="layers-panel" id="layers-panel">
    <div class="layers-panel-header">
      <span class="layers-panel-title">Map Layers</span>
      <button class="layers-close" id="layers-close">✕</button>
    </div>
    <div class="layers-panel-body">
      <label class="layer-item">
        <input type="checkbox" id="toggle-nta" checked>
        <span class="layer-label">
          <span class="layer-name">Neighborhood Scores</span>
          <span class="layer-desc">NTA-level park access grades</span>
        </span>
      </label>
      <label class="layer-item">
        <input type="checkbox" id="toggle-hex" checked>
        <span class="layer-label">
          <span class="layer-name">Block Level Score</span>
          <span class="layer-desc">H3 cell-level proximity scores</span>
        </span>
      </label>
      <label class="layer-item">
        <input type="checkbox" id="toggle-parks" checked>
        <span class="layer-label">
          <span class="layer-name">Parks</span>
          <span class="layer-desc">Public park polygons</span>
        </span>
      </label>
    </div>
  </div>

  <!-- Bottom sheet overlay -->
  <div class="layers-overlay" id="layers-overlay"></div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-title">Flagship Park</div>
    <div class="legend-item">
  <div class="legend-swatch" style="background:#1d6fa4"></div>
  <span>A — under 12 min walk</span>
</div>
<div class="legend-item">
  <div class="legend-swatch" style="background:#74b3ce"></div>
  <span>B — 12 to 26 min walk</span>
</div>
<div class="legend-item">
  <div class="legend-swatch" style="background:#f5c842"></div>
  <span>C — 26 to 38 min walk</span>
</div>
<div class="legend-item">
  <div class="legend-swatch" style="background:#f07c1e"></div>
  <span>D — 38 to 50 min walk</span>
</div>
<div class="legend-item">
  <div class="legend-swatch" style="background:#d7263d"></div>
  <span>F — over 50 min walk</span>
</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- H3 JS library for lat/lng to H3 cell conversion -->
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

  <!-- Map logic -->
  <script src="js/map-fs.js"></script>

</body>
</html>
