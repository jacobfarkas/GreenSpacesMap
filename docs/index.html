<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>GreenSpacesMap - NYC Park Access</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Map styles -->
  <link rel="stylesheet" href="css/map.css"/>
</head>
<body>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Search bar -->
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      id="search-input"
      placeholder="Search an NYC address..."
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >
    <button class="search-clear" id="search-clear" style="display:none">✕</button>
  </div>

  <!-- Autocomplete dropdown -->
  <div class="search-dropdown" id="search-dropdown"></div>

  <!-- Result card -->
  <div class="result-card" id="result-card">
    <div class="result-card-handle"></div>
    <div class="result-card-body">
      <div class="result-address" id="result-address"></div>
      <div class="result-nta" id="result-nta"></div>
      <div class="result-park" id="result-park"></div>
      <div class="result-walk" id="result-walk"></div>
      <div class="result-grade" id="result-grade"></div>
    </div>
  </div>

  <!-- Banner -->
  <div class="map-title">
    <div class="map-title-icon">🌿</div>
    <div class="map-title-text">
      <div class="map-title-heading">
        <span class="title-green">Green</span><br>
        <span class="title-spaces">Spaces</span><br>
        <span class="title-map">MAP</span>
      </div>
      <div class="map-title-sub">Mapping NYC park access</div>
      <div class="map-title-links">
        <strong>Neighborhood</strong>
        <a href="index-fs.html">➛ Flagship</a>
      </div>
    </div>
  </div>

  <!-- Layer toggle button (mobile only) -->
  <button class="layers-btn" id="layers-btn">
    <span>&#9776;</span> Layers
  </button>

  <!-- Layers panel -->
  <div class="layers-panel" id="layers-panel">
    <div class="layers-panel-header">
      <span class="layers-panel-title">Map Layers</span>
      <button class="layers-close" id="layers-close">✕</button>
    </div>
    <div class="layers-panel-body">
      <div class="layer-item">
        <span class="layer-label">
          <span class="layer-name">Score Display</span>
          <span class="layer-desc">Toggle between neighborhood and block level</span>
        </span>
        <div class="layer-toggle-group">
          <button class="layer-toggle-btn active" id="toggle-nta-btn">Neighborhood</button>
          <button class="layer-toggle-btn" id="toggle-hex-btn">Block Level</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom sheet overlay -->
  <div class="layers-overlay" id="layers-overlay"></div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-title">Park Access</div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#1d6fa4"></div>
      A — under 5 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#74b3ce"></div>
      B — 5 to 10 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#f5c842"></div>
      C — 10 to 15 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#f07c1e"></div>
      D — 15 to 20 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#d7263d"></div>
      F — over 20 min walk
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- H3 JS library -->
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

  <!-- Map logic -->
  <script src="js/map.js"></script>

</body>
</html>
