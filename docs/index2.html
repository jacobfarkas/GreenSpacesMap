<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>GreenSpacesMap - NYC Park Access</title>

  <!-- Leaflet CSS from CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Map styles -->
  <link rel="stylesheet" href="css/map.css"/>
</head>
<body>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Title overlay -->
  <div class="map-title">
  <div class="map-title-icon">🌿</div>
  <div class="map-title-text">
    <div class="map-title-heading">
      <span class="title-green">Green</span><br>
      <span class="title-spaces">Spaces</span><br>
      <span class="title-map">MAP</span>
    </div>
    <div class="map-title-sub">Mapping NYC park access</div>
  </div>
</div>

  <!-- Layer toggle controls -->
  <!-- Layer toggle button (mobile only) -->
<button class="layers-btn" id="layers-btn">
  <span>&#9776;</span> Layers
</button>

<!-- Bottom sheet (mobile) / Side panel (desktop) -->
<div class="layers-panel" id="layers-panel">
  <div class="layers-panel-header">
    <span class="layers-panel-title">Map Layers</span>
    <button class="layers-close" id="layers-close">✕</button>
  </div>
  <div class="layers-panel-body">
    <label class="layer-item">
      <input type="checkbox" id="toggle-nta" checked>
      <span class="layer-label">
        <span class="layer-name">Neighborhood Scores</span>
        <span class="layer-desc">NTA-level park access grades</span>
      </span>
    </label>
    <label class="layer-item">
      <input type="checkbox" id="toggle-hex" checked>
      <span class="layer-label">
        <span class="layer-name">Block Level Score</span>
        <span class="layer-desc">H3 cell-level proximity scores</span>
      </span>
    </label>
    <label class="layer-item">
      <input type="checkbox" id="toggle-parks" checked>
      <span class="layer-label">
        <span class="layer-name">Parks</span>
        <span class="layer-desc">Public park polygons</span>
      </span>
    </label>
  </div>
</div>

<!-- Bottom sheet overlay (mobile) -->
<div class="layers-overlay" id="layers-overlay"></div>

  <!-- Grade legend -->
  <div class="legend">
    <div class="legend-title">Park Access</div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#1d6fa4"></div>
      A — under 5 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#74b3ce"></div>
      B — 5 to 10 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#f5c842"></div>
      C — 10 to 15 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#f07c1e"></div>
      D — 15 to 20 min walk
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#d7263d"></div>
      F — over 20 min walk
    </div>
  </div>

  <!-- Leaflet JS from CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Map logic -->
  <script src="js/map.js"></script>

</body>
</html>
